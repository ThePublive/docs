items:
  - slug: manage-posts
    title: "Posts list"
    type: doc
    action: new
    target_path: dxp/documentation/publishing/posts-list.mdx
    nav_group: "Publishing (new group)"
    priority: 1
    status: todo
    routes: ["/v2/posts/published?content=true", "/v2/posts/draft", "/v2/posts/pending-approval"]
    brief: |
      Purpose: The Posts list for every post type, split into status tabs, with filters and a create entry point.
      UI labels: sidebar "Posts", "Created by me"; tabs "Published", "Draft", "Pending Approval", "Scheduled";
        "Start date" / "End date"; "Filter"; "Preferences"; "Select all"; row "Edit"; row "Mark as complete"
        (live blog rows); "Discard" (Draft rows; not exercised); pagination.
      Create menu ("Create" in sidebar, "Quick Create" in header): "Article", "Video", "Web Story", "Photo Gallery",
        "Live Blog", "Custom Content", plus custom entity types. Each type opens a list with "<Type> Create".
      Preferences (column toggles): "Status", "Categories", "Content Writer", "Credits", "Page Views", "SEO Score", "Timeline".
      Journey: 1. Sidebar > Posts. 2. Pick a status tab. 3. Set Start/End date or Filter. 4. Preferences to choose
        columns. 5. Edit a row, or Create > Article > "Article Create".
      Likely changed: Content Workflows (Oct 21, 2026) may change "Pending Approval" for workflow-enabled content types.
    open_questions:
      - "Which fields does the Filter dialog offer?"
      - "What bulk actions appear after 'Select all'?"
      - "What does 'Mark as complete' do, and on which post types?"
      - "Does 'Discard' delete a draft permanently?"

